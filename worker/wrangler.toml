name = "spare"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The web app (PC version) is served from ../web by the same Worker.
[assets]
directory = "../web"

[[d1_databases]]
binding = "DB"
database_name = "spare"
# Replaced automatically by the GitHub Action from the D1_DATABASE_ID secret.
database_id = "D1_DATABASE_ID_PLACEHOLDER"

# Reads receipt photos (free daily allowance on Workers AI).
[ai]
binding = "AI"

[vars]
# New accounts need an invite code from the admin (the first account created).
# Set to "false" to stop all new sign-ups, even with a code.
ALLOW_SIGNUP = "true"
# Ticket scans + savings ideas per person per day (the admin has no limit).
DAILY_AI_LIMIT = "25"
# Optional, for "forgot password" emails via Resend (resend.com, free tier):
# MAIL_FROM = "Spare <spare@watchtvrabbit.dev>"   and add the secret RESEND_API_KEY.

# Optional: serve on your own domain instead of spare.<you>.workers.dev
# routes = [{ pattern = "spare.watchtvrabbit.dev", custom_domain = true }]
